<!doctype html>
<!-- Renders one view of the twin full-window for a static poster image.
     Used by tools/build-assets.sh: render.html?view=hero|aquifer|eng|sky|before|after -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>render</title>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <style>
    html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0b0d0c; }
    canvas, img { display: block; width: 100vw; height: 100vh; object-fit: cover; }
    [hidden] { display: none !important; }
    .aq { background: radial-gradient(80% 70% at 50% 40%, #16201c, #0d100f); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <img id="i" alt="" hidden>
  <img id="j" alt="" hidden>
  <script type="module">
    import * as S from '../js/scenes.js';
    const view = new URLSearchParams(location.search).get('view') || 'hero'; // add &quality=high for full detail
    const c = document.getElementById('c');
    if (view === 'hero') S.initHero(c);
    if (view === 'aquifer') { document.body.className = 'aq'; S.initSubsurface(c).setCutaway(true); }
    if (view === 'eng') S.initEngineering(c);
    if (view === 'sky') S.initWatch(c);
    if (view === 'before' || view === 'after') {
      c.hidden = true;
      const i = document.getElementById('i'), j = document.getElementById('j');
      S.renderOutcome(i, j, { width: 1600, height: 820 });
      (view === 'before' ? i : j).hidden = false;
    }
  </script>
</body>
</html>
